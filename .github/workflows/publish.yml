# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  push:
    branches:
      - 'main'       # Run the workflow when pushing to the main branch
    tags:
      - '*'
  pull_request:
    branches:
      - 'main'       # Run the workflow only for pull requests targeting main

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace}}/nuget

defaults:
  run:
    shell: pwsh

jobs:
  run_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
          11.0.x
    - name: Build .NET 10 library targets
      run: dotnet build RuntimeApps.Authentication.EF/RuntimeApps.Authentication.EF.csproj --configuration Release --framework net10.0
    - name: Run tests
      run: dotnet test --configuration Release

  create_nuget:
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Get all history to allow automatic versioning using MinVer

    # Install both SDKs required to build and pack the multi-targeted libraries.
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
          11.0.x

    # Create the NuGet package in the folder from the environment variable NuGetDirectory
    - run: dotnet pack --configuration Release --output ${{ env.NuGetDirectory }} /p:PackageVersion=${{github.ref_name}}

    # Publish the NuGet package as an artifact, so they can be used in the following jobs
    - uses: actions/upload-artifact@v7
      with:
        name: nuget
        if-no-files-found: error
        retention-days: 7
        path: ${{ env.NuGetDirectory }}/*.nupkg

  deploy:
    # Publish only when creating a GitHub Release
    # https://github.com/RuntimeApps/RuntimeApps.Authentication/releases
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [ run_test,create_nuget ]
    permissions:
      id-token: write   # lets the job request a GitHub OIDC token
    steps:
      # Download the NuGet package created in the previous job
      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      # No .NET SDK is needed to publish already packed NuGet artifacts.

      # Exchange the OIDC token for a short-lived NuGet API key
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name, NOT your email

      # Publish all NuGet packages to NuGet.org
      # Use --skip-duplicate to prevent errors if the workflow is retried.
      - name: Publish NuGet package
        run: dotnet nuget push "${{ env.NuGetDirectory }}/*.nupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
