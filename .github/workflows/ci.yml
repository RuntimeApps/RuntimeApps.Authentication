name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, "feature/**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore RuntimeApps.Authentication.sln
      - name: Build
        run: dotnet build RuntimeApps.Authentication.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Tests/RuntimeApps.Authentication.Test/RuntimeApps.Authentication.Test.csproj --configuration Release --no-build
